[theme]
base = "light"
primaryColor = "#087F8C"
backgroundColor = "#F8FAFC"
secondaryBackgroundColor = "#EDF2F7"
textColor = "#162D46"
font = "sans serif"

[browser]
gatherUsageStats = false

[server]
headless = true
enableStaticServing = false

[client]
toolbarMode = "viewer"
showErrorDetails = "type"
