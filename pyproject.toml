[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weekly-option-research"
version = "0.1.0"
description = "NH Futures API documentation audit and read-only research tools"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1,<4"]

[project.optional-dependencies]
dashboard = ["numpy>=1.26,<3", "pandas>=2.2,<4", "matplotlib>=3.8,<4", "plotly>=6,<7"]
reports = ["python-docx>=1.1,<2"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
nh-research = "nh_research.cli:main"
