[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "weekly-option-research"
version = "0.1.0"
description = "NH Futures API documentation audit and read-only research tools"
requires-python = ">=3.10"
dependencies = ["openpyxl>=3.1,<4"]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
nh-research = "nh_research.cli:main"
